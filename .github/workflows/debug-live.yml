name: Live debug (read-only + write probe)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: PHP probe (version + extensions) and remote state
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -uo pipefail
          COMMON="set ssl:verify-certificate no; set ftp:passive-mode on; set net:max-retries 3"
          lftp_cmd() {
            echo "--- FTP: $1"
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$COMMON; $1; bye" 2>&1
            echo "--- exit: $?"
          }
          {
            echo '<?php header("Content-Type: text/plain");'
            echo 'echo "PHP_VERSION=".PHP_VERSION."\n";'
            echo 'echo "SAPI=".php_sapi_name()."\n";'
            echo 'echo "EXTS=".implode(",", get_loaded_extensions())."\n";'
            echo 'echo "PDO=".(class_exists("PDO")?"yes":"no")."\n";'
            echo 'echo "PDO_MYSQL=".(extension_loaded("pdo_mysql")?"yes":"no")."\n";'
            echo 'echo "MBSTRING=".(function_exists("mb_split")?"yes":"no")."\n";'
          } > /tmp/ossz-probe.php
          PROBE=".php-probe-$(date +%s).php"
          echo "== upload probe =="
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$COMMON; put /tmp/ossz-probe.php -o public_html/$PROBE; bye" 2>&1 || echo "probe upload failed"
          echo "== run probe =="
          curl -s --max-time 30 "https://osszcollection.com/$PROBE" || echo "(probe request failed)"
          echo
          echo "== delete probe =="
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$COMMON; rm -f public_html/$PROBE; bye" 2>&1 || true
          echo "== production error messages (last 5) =="
          lftp_cmd "cat public_html/storage/logs/laravel.log" | grep -oE "] production\.[A-Z]+: [^{]{0,140}" | tail -5 || true
