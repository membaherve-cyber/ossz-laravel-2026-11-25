name: Live debug (read-only)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect remote tree, skeleton and error log
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -uo pipefail
          lftp_cmd() {
            echo "--- FTP: $1"
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ssl:verify-certificate no; set ftp:passive-mode on; set net:max-retries 3; $1; bye" 2>&1
            echo "--- exit: $?"
          }
          echo "== top-level (existence of .env / vendor / .htaccess) =="
          lftp_cmd "ls -a public_html" || true
          echo "== public/index.php + public/.htaccess sizes =="
          lftp_cmd "ls -l public_html/public/index.php public_html/public/.htaccess public_html/artisan" || true
          echo "== bootstrap/cache =="
          lftp_cmd "ls -l public_html/bootstrap/cache" || true
          echo "== storage skeleton =="
          lftp_cmd "ls -l public_html/storage" || true
          echo "== storage/logs =="
          lftp_cmd "ls -l public_html/storage/logs" || true
          echo "== laravel.log tail =="
          lftp_cmd "cat public_html/storage/logs/laravel.log" | tail -80 || echo "(no laravel.log)"
