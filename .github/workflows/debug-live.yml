name: Live debug (PHP probe matrix)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Probe live PHP builds (handler matrix v2)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -uo pipefail
          COMMON="set ssl:verify-certificate no; set ftp:passive-mode on; set net:max-retries 3"

          cat > /tmp/probe.php <<'PHP'
          <?php header("Content-Type: text/plain");
          echo "PHP_VERSION=".PHP_VERSION."\n";
          echo "SAPI=".php_sapi_name()."\n";
          echo "EXT_COUNT=".count(get_loaded_extensions())."\n";
          echo "HAS_PDO=".(class_exists("PDO")?"yes":"no")."\n";
          echo "HAS_PDO_MYSQL=".(extension_loaded("pdo_mysql")?"yes":"no")."\n";
          echo "HAS_MBSTRING=".(function_exists("mb_strlen")?"yes":"no")."\n";
          echo "HAS_GD=".(extension_loaded("gd")?"yes":"no")."\n";
          echo "EXT_LIST=".implode(",",get_loaded_extensions())."\n";
          PHP

          TS=$(date +%s)
          # name:handler pairs — v74/v81 are CANARIES: if they report 7.4/8.1,
          # per-directory AddHandler pinning works on this server.
          VARIANTS="v74:alt-php74___lsphp v81:alt-php81___lsphp v83:alt-php83___lsphp v84:alt-php84___lsphp ea81:ea-php81___lsphp ea82:ea-php82___lsphp ea83:ea-php83___lsphp ea84:ea-php84___lsphp"

          UP=/tmp/lftp-up.txt
          {
            echo "$COMMON"
            for v in $VARIANTS; do
              name="${v%%:*}"
              echo "mkdir -p public_html/public/probe-$name-$TS"
              echo "put /tmp/probe.php -o public_html/public/probe-$name-$TS/probe.php"
              printf 'AddHandler application/x-httpd-%s .php\n' "${v##*:}" > /tmp/hta-$name
              echo "put /tmp/hta-$name -o public_html/public/probe-$name-$TS/.htaccess"
            done
            echo "bye"
          } > $UP
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" < $UP

          echo "== base (account default) =="
          curl -s --max-time 30 "https://osszcollection.com/probe.php?r=$TS" || echo "(failed)"

          for v in $VARIANTS; do
            name="${v%%:*}"
            echo "== $name (${v##*:}) =="
            sleep 2
            curl -s --max-time 30 "https://osszcollection.com/probe-$name-$TS/probe.php?r=$TS" || echo "(failed)"
          done

          echo "== cleanup =="
          CLEAN=/tmp/lftp-rm.txt
          {
            echo "$COMMON"
            for v in $VARIANTS; do
              name="${v%%:*}"
              echo "rm -r -f public_html/public/probe-$name-$TS"
            done
            echo "bye"
          } > $CLEAN
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" < $CLEAN || true

          echo "== production error messages (last 3) =="
          {
            echo "$COMMON"
            echo "cat public_html/storage/logs/laravel.log"
            echo "bye"
          } > /tmp/lftp-log.txt
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" < /tmp/lftp-log.txt 2>/dev/null | grep -oE "] production\.[A-Z]+: [^{]{0,160}" | tail -3 || true
