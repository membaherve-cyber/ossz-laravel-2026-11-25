name: CI + Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── 1. Static analysis: every PHP file must parse ────────────────────
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Syntax-check every PHP file
        run: |
          set -e
          FAIL=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null 2>&1 || { echo "SYNTAX ERROR: $f"; php -l "$f" || true; FAIL=1; }
          done < <(find app config database routes public -name '*.php' -print0 2>/dev/null)
          exit $FAIL

  # ── 2. Integration: boot the app on MySQL and exercise the flows ─────
  integration:
    runs-on: ubuntu-latest
    needs: php-lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ossz
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli, pdo_mysql, mbstring, dom, fileinfo
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=ossz/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          echo "SEED_STAFF_PASSWORD=admin" >> .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --force
      - name: Boot server
        run: |
          php artisan serve --host=127.0.0.1 --port=8080 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && break || sleep 1
          done
      - name: Page smoke (no blank pages allowed)
        run: |
          set -e
          check() {
            local path="$1" grep_for="${2:-}" min_size="${3:-1000}"
            local body status
            status=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080$path")
            local size=$(wc -c < /tmp/page.html)
            if [ "$status" != "200" ] || [ "$size" -lt "$min_size" ]; then
              echo "FAIL $path -> HTTP $status, $size bytes"; exit 1
            fi
            if [ -n "$grep_for" ] && ! grep -q "$grep_for" /tmp/page.html; then
              echo "FAIL $path -> missing '$grep_for'"; exit 1
            fi
            echo "ok   $path ($size bytes)"
          }
          check "/" "OSSZ"
          check "/shop" "product/"
          check "/shop?category=tops" "OSSZ"
          check "/collections" "OSSZ"
          check "/collections/wouri-nights" "OSSZ"
          check "/product/ivoire-occasion-gown" "FCFA"
          check "/journal" "OSSZ"
          check "/lookbook" "OSSZ"
          check "/about" "OSSZ"
          check "/contact" "OSSZ"
          check "/faq" "OSSZ"
          check "/size-guide" "OSSZ"
          check "/cart" "OSSZ"
          check "/login" "Back office"
          check "/register" "OSSZ"
          check "/forgot-password" "OSSZ"
          check "/appointments" "OSSZ"
          check "/order-lookup" "OSSZ"
          check "/offline" "OSSZ"
          check "/robots.txt" "Sitemap" 50
          check "/sitemap.xml" "urlset"
      - name: Login smoke (session cookie must survive the POST)
        run: |
          set -e
          JAR=/tmp/jar.txt; rm -f "$JAR"
          TOKEN=$(curl -s -c "$JAR" http://127.0.0.1:8080/login | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"$//')
          [ -n "$TOKEN" ] || { echo "no CSRF token on login page"; exit 1; }
          LOC=$(curl -s -b "$JAR" -c "$JAR" -o /dev/null -w '%{redirect_url}' \
            -H "Referer: http://127.0.0.1:8080/login" \
            --data-urlencode "_token=$TOKEN" \
            --data-urlencode "email=admin" \
            --data-urlencode "password=admin" \
            http://127.0.0.1:8080/login)
          echo "login redirect: $LOC"
          echo "$LOC" | grep -q "/admin" || { echo "login did not reach /admin"; exit 1; }
          curl -s -b "$JAR" -o /tmp/admin.html -w 'GET /admin: %{http_code}\n' http://127.0.0.1:8080/admin | grep -q 200
          grep -q "OSSZ" /tmp/admin.html || { echo "admin page empty"; exit 1; }
          echo "login smoke OK"

  # ── 3. Deploy: WIPE the remote version, then fresh-mirror + purge ────
  deploy:
    runs-on: ubuntu-latest
    needs: [php-lint, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Wipe remote (delete old version before upload)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          # Fetch the top-level listing of public_html (both with and without
          # dotfiles — some servers ignore `LIST -a`).
          LIST=$(
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTP'
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 6
          set net:timeout 30
          set net:total-timeout 300
          ls -a public_html
          quit
          LFTP
          ) 2>/dev/null || true
          LIST2=$(
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTP'
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 6
          set net:timeout 30
          set net:total-timeout 300
          ls public_html
          quit
          LFTP
          ) 2>/dev/null || true
          echo "Remote top level (with dotfiles):"
          echo "$LIST"
          # Keep only server-owned runtime state: .env (live credentials),
          # vendor/ (composer deps, matching the unchanged composer.lock)
          # and .well-known/ (SSL certificate renewal).
          rm_names=$(printf '%s\n%s\n' "$LIST" "$LIST2" \
            | awk 'NF>=9 {print $NF}' \
            | grep -vxE '\.|\.\.|\.env|vendor|\.well-known' \
            | sort -u || true)
          echo "Will delete:"
          echo "$rm_names"
          if [ -n "$rm_names" ]; then
            {
              echo "set ssl:verify-certificate no"
              echo "set ftp:passive-mode on"
              echo "set net:max-retries 6"
              echo "set net:timeout 30"
              echo "set net:total-timeout 1200"
              echo "set cmd:fail-exit no"
              for n in $rm_names; do
                echo "rm -r -f public_html/$n"
              done
              # Recreate the runtime skeleton the framework expects (the
              # mirror excludes storage/ and bootstrap/cache/ on purpose).
              echo "mkdir -p public_html/bootstrap/cache"
              echo "mkdir -p public_html/storage/framework/views"
              echo "mkdir -p public_html/storage/framework/cache/data"
              echo "mkdir -p public_html/storage/framework/sessions"
              echo "mkdir -p public_html/storage/logs"
              echo "mkdir -p public_html/storage/app/public"
              echo "quit"
            } | lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST"
          fi
          echo "Remote wiped (kept .env, vendor/, .well-known/)."
      - name: Push code to Namecheap (fresh mirror of this version)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<'LFTP'
          set ssl:verify-certificate no
          set ftp:passive-mode on
          set net:max-retries 6
          set net:timeout 30
          set net:total-timeout 1200
          # Upload this version over the now-empty tree. mirror -R never
          # deletes, but everything not in this commit was removed by the
          # wipe step above — the remote ends up containing exactly this
          # version (plus the kept .env / vendor / .well-known).
          mirror -R --no-perms --parallel=4 \
            --exclude '^\.git/' \
            --exclude '^\.github/' \
            --exclude '^bootstrap/cache/' \
            --exclude 'database/database\.sqlite$' \
            --exclude '^vendor/' \
            --exclude '^storage/' \
            . public_html/
          # Purge compiled Blade views so every deploy starts clean. A
          # truncated/stale compiled view renders as a 200 + EMPTY body
          # (the "blank page" bug); recompiling from source fixes it.
          # Blade's compiler auto-creates the directory, so no mkdir needed.
          # Best-effort: live traffic may recreate files mid-delete — that
          # is fine (fresh compile) and must not fail the deploy.
          set cmd:fail-exit no
          rm -r -f public_html/storage/framework/views
          # Purge any stale route/config caches so freshly deployed routes
          # (and config) always take effect; Laravel rebuilds them from the
          # source files on the next request.
          rm -f public_html/bootstrap/cache/routes-v7.php \
                public_html/bootstrap/cache/config.php \
                public_html/bootstrap/cache/events.php \
                public_html/bootstrap/cache/compiled.php
          quit
          LFTP
          echo "Deployed to Namecheap public_html (fresh full mirror, views purged)."
      - name: Post-deploy diagnostics (remote tree + error log tail)
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp_cmd() {
            lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$1; set ssl:verify-certificate no; set ftp:passive-mode on; set net:max-retries 3; bye" 2>/dev/null
          }
          echo "== top-level listing (kept: .env vendor .well-known) =="
          lftp_cmd "ls -a public_html" || true
          echo "== bootstrap/cache =="
          lftp_cmd "ls -l public_html/bootstrap/cache" || true
          echo "== storage skeleton =="
          lftp_cmd "ls -l public_html/storage" || true
          echo "== laravel.log tail =="
          lftp_cmd "cat public_html/storage/logs/laravel.log" | tail -60 || echo "(no laravel.log yet)"

  # ── 4. Live smoke: the production site itself must pass ──────────────
  smoke-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify the live storefront end-to-end
        env:
          SMOKE_USER: admin
          SMOKE_PASS: admin
        run: |
          set -e
          BASE="https://osszcollection.com"
          check() {
            local path="$1" grep_for="${2:-}" min_size="${3:-1000}"
            local status size
            status=$(curl -sL -o /tmp/live.html -w '%{http_code}' --max-time 30 "$BASE$path")
            size=$(wc -c < /tmp/live.html)
            if [ "$status" != "200" ] || [ "$size" -lt "$min_size" ]; then
              echo "FAIL $path -> HTTP $status, $size bytes"; exit 1
            fi
            if [ -n "$grep_for" ] && ! grep -q "$grep_for" /tmp/live.html; then
              echo "FAIL $path -> missing '$grep_for'"; exit 1
            fi
            echo "ok   $path ($size bytes)"
          }
          check "/" "OSSZ"
          check "/shop" "product/"
          check "/collections/wouri-nights" "OSSZ"
          check "/product/ivoire-occasion-gown" "FCFA"
          check "/journal" "OSSZ"
          check "/login" "Back office"
          check "/robots.txt" "Sitemap" 50
          check "/sitemap.xml" "urlset"
          check "/offline" ""
          # sw.js must never be HTTP-cached and must be the current version
          curl -sI "$BASE/sw.js" | grep -qi "cache-control: no-cache" || { echo "sw.js is cacheable — stale-worker wedge risk"; exit 1; }
          curl -s "$BASE/sw.js" | grep -q "ossz-v3" || { echo "sw.js is not the v3 worker"; exit 1; }
          # www must land on the HTTPS apex in one hop
          WWW_LOC=$(curl -s -o /dev/null -w '%{redirect_url}' "https://www.osszcollection.com/")
          echo "www redirect: $WWW_LOC"
          echo "$WWW_LOC" | grep -q "^https://osszcollection.com" || { echo "www does not redirect to https apex"; exit 1; }
          # login flow on production
          JAR=/tmp/live_jar.txt; rm -f "$JAR"
          TOKEN=$(curl -s -c "$JAR" "$BASE/login" | grep -o 'name="_token" value="[^"]*"' | head -1 | sed 's/.*value="//;s/"$//')
          LOC=$(curl -s -b "$JAR" -c "$JAR" -o /dev/null -w '%{redirect_url}' \
            -H "Referer: $BASE/login" \
            --data-urlencode "_token=$TOKEN" \
            --data-urlencode "email=$SMOKE_USER" \
            --data-urlencode "password=$SMOKE_PASS" \
            "$BASE/login")
          echo "live login redirect: $LOC"
          echo "$LOC" | grep -q "/admin" || { echo "live login broken"; exit 1; }
          curl -s -b "$JAR" -o /tmp/admin.html -w 'GET /admin: %{http_code}\n' --max-time 30 "$BASE/admin" | grep -q 200
          echo "LIVE SMOKE OK — storefront, assets, host canonicalisation and login all verified"
